name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Runtime smoke test
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 npm start > /tmp/oleg-web.log 2>&1 &
          npm run smoke -- http://127.0.0.1:3000

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build
      # Strapi 5.52.1 currently carries a high advisory in its Admin AI SDK.
      # SECURITY.md documents the upstream exception; critical remains blocking.
      - run: npm audit --omit=dev --audit-level=critical

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, cms]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.docker.example config --quiet
      - run: docker compose --env-file .env.docker.example build web cms
